# The live forward test: every weekday after the US close, record tomorrow's
# predictions and fill in yesterday's outcomes, then commit the results.
# Results: forward_test/predictions.csv and forward_test/scorecard.md
name: Forward test

on:
  schedule:
    # 23:30 UTC = 6:30 pm New York in winter, 7:30 pm in summer: after the 6 pm cutoff.
    # GitHub can start scheduled jobs late at busy times; that's fine here.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:   # the "Run workflow" button, for running it by hand

permissions:
  contents: write      # needed to commit the results

concurrency:
  group: forward-test  # never two runs at once
  cancel-in-progress: false

jobs:
  forward-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install libraries
        # The same versions as the reports, from requirements-lock.txt, for the libraries the job needs
        run: pip install -r requirements-forward.txt -c requirements-lock.txt

      - name: Run the forward test
        run: python forward_test.py

      - name: Save the results
        if: always()   # save what worked, even if one stock failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward_test/
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          # Name the commit after the close the latest predictions came from (New York date)
          latest=$(python -c "import pandas as pd; print(pd.read_csv('forward_test/predictions.csv')['made_on'].max())" || echo "unknown")
          git commit -m "Forward test: predictions from the close of $latest"
          # Something else may have reached main while the job ran (a push of your own):
          # bring it in first, so this evening's predictions are never lost
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt of 3); trying again in 20 seconds"
            sleep 20
          done
          echo "Could not save this evening's predictions: run the workflow again by hand before tomorrow's open"
          exit 1