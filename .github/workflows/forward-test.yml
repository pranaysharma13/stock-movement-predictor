# The live forward test: every weekday after the US close, record tomorrow's
# predictions and fill in yesterday's outcomes, then commit the results.
# Results: forward_test/predictions.csv and forward_test/scorecard.md (logistic regression),
# forward_test/lstm_predictions.csv and forward_test/lstm_scorecard.md (the LSTM, move size),
# and the LSTM's monthly models in forward_test/lstm_models/
name: Forward test

on:
  schedule:
    # 23:17 UTC = 6:17 pm New York in winter, 7:17 pm in summer: after the 6 pm cutoff in
    # both seasons (src/data.py treats a day as unfinished before then). An odd minute,
    # because GitHub starts jobs scheduled on :00 and :30 hours late at busy times.
    - cron: "17 23 * * 1-5"
  workflow_dispatch:   # the "Run workflow" button, for running it by hand

permissions:
  contents: write      # needed to commit the results

concurrency:
  group: forward-test  # never two runs at once
  cancel-in-progress: false

jobs:
  forward-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # the first evening of a month also retrains the LSTM
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install libraries
        # The same versions as the reports, from requirements-lock.txt, for the libraries the job needs
        run: pip install -r requirements-forward.txt -c requirements-lock.txt

      - name: Run the forward test
        run: python forward_test.py

      # The LSTM runs separately: if PyTorch can't be installed or the LSTM fails,
      # logistic regression's results above are still saved
      - name: Install PyTorch for the LSTM
        id: torch
        if: always()
        continue-on-error: true
        # The CPU-only build is far smaller; the version is pinned in requirements-lstm.txt
        run: pip install -r requirements-lstm.txt -c requirements-lock.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Run the LSTM forward test
        if: always() && steps.torch.outcome == 'success'
        continue-on-error: true
        run: python forward_test_lstm.py

      - name: Save the results
        if: always()   # save what worked, even if one stock failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward_test/
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          # Name the commit after the close the latest predictions came from (New York date)
          latest=$(python -c "import pandas as pd; print(pd.read_csv('forward_test/predictions.csv')['made_on'].max())" || echo "unknown")
          git commit -m "Forward test: predictions from the close of $latest"
          # Something else may have reached main while the job ran (a push of your own):
          # bring it in first, so this evening's predictions are never lost
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt of 3); trying again in 20 seconds"
            sleep 20
          done
          echo "Could not save this evening's predictions: run the workflow again by hand before tomorrow's open"
          exit 1